PROVIDER_ID=fable
PROVIDER_LABEL="Claude Fable"
PROVIDER_ROLE=reviewer
PROVIDER_SUMMARY="The final call. Runs once per round, after every other decision. It sees the
question, each panel answer by name, the arbiter's ruling and any tiebreak
verdict. It says whether it upholds, amends or overturns them, then gives the
answer the round returns. It is the slowest and most expensive model, so it is
spent once, where a mistake is costliest."
PROVIDER_CAPS="final"
PROVIDER_RANK=5
PROVIDER_BIN_NAME=claude
PROVIDER_BIN_ENV=CLAUDE_BIN
PROVIDER_BIN_CANDIDATES="$HOME/.local/bin/claude $HOME/.local/bin/claude.exe /usr/local/bin/claude"
PROVIDER_DEFAULT_MODEL=claude-fable-5-1
PROVIDER_AUTH_HINT="run 'claude' then /login (Claude subscription)"
PROVIDER_MODELS_HINT="opus, sonnet, haiku, fable — see /model inside claude"

provider_invoke() {
  # advisorModel is blanked for this call. Otherwise Claude Code's advisor tool
  # is present, the headless system prompt says to call it, and every Claude
  # call quietly consults another model. That breaks panel independence and
  # duplicates the explicit final review.
  # Tools are read-only AND confined: --restricted limits file tools to the
  # working directory (the repo under review), drops command-running tools and
  # ignores user/project settings; --strict-mcp-config drops MCP servers. A
  # judge can check a claim against the code, but an instruction smuggled into
  # an answer it is shown cannot make it run commands or read ~/.ssh.
  set -- -p --restricted --strict-mcp-config --settings '{"advisorModel":""}' \
         --tools "Read,Grep,Glob"
  [ -n "${P_MODEL:-}" ] && set -- "$@" --model "$P_MODEL"
  "$P_BIN" "$@"
}
PROVIDER_INSTALL_CMD="npm install -g @anthropic-ai/claude-code"
PROVIDER_INSTALL_HINT="npm install -g @anthropic-ai/claude-code  (or https://claude.com/claude-code)"
PROVIDER_AUTH_KIND=oauth
