PROVIDER_ID=codex
PROVIDER_LABEL="Codex (GPT)"
PROVIDER_ROLE=investigator
PROVIDER_SUMMARY="The advisor that explores a codebase on its own. Given a
directory it reads files and runs commands under a read-only sandbox, then
reports. Strongest at precise defect-finding: it returns specific, falsifiable
claims rather than general impressions."
PROVIDER_CAPS="explore reason review tiebreak arbiter"
PROVIDER_RANK=20
PROVIDER_BIN_NAME=codex
PROVIDER_BIN_ENV=CODEX_BIN
PROVIDER_BIN_CANDIDATES="$HOME/.local/bin/codex /usr/local/bin/codex $HOME/AppData/Roaming/npm/codex"
PROVIDER_DEFAULT_MODEL=""
PROVIDER_AUTH_HINT="run 'codex login' (ChatGPT subscription)"
PROVIDER_MODELS_HINT="see 'codex --help'"

provider_invoke() {
  answer="$(mktemp)"
  # -o/--output-last-message yields the final answer alone, with no event-log noise.
  set -- exec --sandbox read-only --skip-git-repo-check -o "$answer"
  [ -n "${P_MODEL:-}" ] && set -- "$@" -m "$P_MODEL"
  [ -n "${P_DIR:-}" ]   && set -- "$@" -C "$P_DIR"
  rc=0
  # codex reads the prompt from stdin when given a trailing '-'.
  "$P_BIN" "$@" - >/dev/null || rc=$?
  # codex exec exits 0 even on auth failure, so content is the only real test.
  cat "$answer"; rm -f "$answer"
  return $rc
}
PROVIDER_INSTALL_CMD="npm install -g @openai/codex"
PROVIDER_INSTALL_HINT="npm install -g @openai/codex"
PROVIDER_AUTH_KIND=oauth
