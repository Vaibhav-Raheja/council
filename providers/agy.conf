PROVIDER_ID=agy
PROVIDER_LABEL="Gemini (Antigravity CLI)"
PROVIDER_ROLE=reader
PROVIDER_SUMMARY="A reasoning engine with a very large context window. Feed it
content rather than sending it exploring: it cannot run shell tools in print
mode, and it reaches for one anyway even when everything it needs is already in
the prompt, which returns nothing. This provider prepends a no-tools instruction
to make that deterministic. Verified to carry 20KB+ in a single prompt."
PROVIDER_CAPS="feed reason review large-context tiebreak arbiter"
PROVIDER_RANK=30
PROVIDER_BIN_NAME=agy
PROVIDER_BIN_ENV=AGY_BIN
PROVIDER_BIN_CANDIDATES="$HOME/AppData/Local/agy/bin/agy.exe $HOME/.local/bin/agy $HOME/.agy/bin/agy /usr/local/bin/agy /opt/agy/bin/agy"
PROVIDER_DEFAULT_MODEL=""
PROVIDER_AUTH_HINT="run 'agy' once and sign in (Google / Antigravity account)"
PROVIDER_MODELS_HINT="run 'agy models'; gemini-3.1-pro-high is deepest"

provider_invoke() {
  prompt="$(cat)"
  # Without this it spontaneously attempts a shell tool, print mode soft-denies
  # it, and the whole call returns nothing. Verified: same prompt fails without.
  if [ -z "${COUNCIL_AGY_ALLOW_TOOLS:-}" ]; then
    prompt="Do not run any commands and do not use any tools. Answer from the information given.

$prompt"
  fi
  set -- --output-format text --mode plan
  [ -n "${P_MODEL:-}" ] && set -- "$@" --model "$P_MODEL"
  [ -n "${P_DIR:-}" ]   && set -- "$@" --add-dir "$(council_native_path "$P_DIR")"
  # The prompt MUST be fused to the flag: `-p "$X"` makes agy swallow the next
  # flag as the prompt and silently ignore yours.
  "$P_BIN" "$@" -p="$prompt"
}
PROVIDER_INSTALL_HINT="ships with Antigravity — https://antigravity.google ; then 'agy install' for PATH"
PROVIDER_AUTH_KIND=oauth
