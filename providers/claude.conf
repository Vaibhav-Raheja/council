PROVIDER_ID=claude
PROVIDER_LABEL="Claude"
PROVIDER_ROLE=chair
PROVIDER_SUMMARY="Orchestration, synthesis and writing code in place. Holds state
across a long task, follows multi-constraint instructions, and reconciles
advisors who disagree. As chair it sees the other answers, so it can launder a
real disagreement into false consensus — the synthesis prompt forbids that."
PROVIDER_CAPS="chair reason review tiebreak arbiter write"
PROVIDER_RANK=10
PROVIDER_BIN_NAME=claude
PROVIDER_BIN_ENV=CLAUDE_BIN
PROVIDER_BIN_CANDIDATES="$HOME/.local/bin/claude $HOME/.local/bin/claude.exe /usr/local/bin/claude"
PROVIDER_DEFAULT_MODEL=""
PROVIDER_AUTH_HINT="run 'claude' then /login (Claude subscription)"
PROVIDER_MODELS_HINT="opus, sonnet, haiku — see /model inside claude"

provider_invoke() {
  set -- -p
  [ -n "${P_MODEL:-}" ] && set -- "$@" --model "$P_MODEL"
  "$P_BIN" "$@"
}
PROVIDER_INSTALL_CMD="npm install -g @anthropic-ai/claude-code"
PROVIDER_INSTALL_HINT="npm install -g @anthropic-ai/claude-code  (or https://claude.com/claude-code)"
PROVIDER_AUTH_KIND=oauth
