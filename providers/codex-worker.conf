PROVIDER_ID=codex-worker
PROVIDER_LABEL="Codex worker (GPT)"
PROVIDER_ROLE=worker
PROVIDER_SUMMARY="Edits code for council delegate, inside a worktree council created. Runs
commands under bubblewrap with a permission profile: it can read and write the
worktree only, has no network, and has web search, browser and app connectors
off. Benchmarked 4/4 contained (docs/delegation-bench-2026-10-21.md). Never
advises or judges."
PROVIDER_CAPS="delegate"
PROVIDER_BASE=codex
PROVIDER_CONTAINMENT="codex exec permission profile: :root denied, worktree writable, network off, web_search/apps/browser disabled; refuses to run outside a council delegate worktree"
PROVIDER_RANK=10
PROVIDER_BIN_NAME=codex
PROVIDER_BIN_ENV=CODEX_BIN
PROVIDER_BIN_CANDIDATES="$HOME/.local/bin/codex /usr/local/bin/codex $HOME/AppData/Roaming/npm/codex"
PROVIDER_DEFAULT_MODEL=""
PROVIDER_AUTH_HINT="run 'codex login' (ChatGPT subscription)"
PROVIDER_MODELS_HINT="see 'codex --help'"

provider_invoke() {
  # Only inside the worktree council delegate made for this job.
  if [ -z "${P_DIR:-}" ] || [ "$P_DIR" != "${COUNCIL_DELEGATE_WORKTREE:-}" ]; then
    echo "codex-worker: refusing to run outside a council delegate worktree" >&2; return 2
  fi
  # Codex re-executes its own binary inside the sandbox, so the node install it
  # lives in must stay readable once :root is denied. Derived, not hardcoded.
  readable=""
  for b in "$P_BIN" "$(command -v node 2>/dev/null)"; do
    [ -n "$b" ] || continue
    r="$(readlink -f "$b" 2>/dev/null || echo "$b")"
    case "$r" in */lib/node_modules/*) r="${r%%/lib/node_modules/*}" ;; *) r="$(dirname "$(dirname "$r")")" ;; esac
    case " $readable " in *" $r "*) ;; *) readable="$readable $r" ;; esac
  done
  fs='":root"="deny",":minimal"="read"'
  for r in $readable; do fs="$fs,\"$r\"=\"read\""; done
  fs="$fs,\":workspace_roots\"={\".\"=\"write\"}"
  answer="$(mktemp)"
  # A permission profile, not --sandbox: the two cannot be combined, and plain
  # workspace-write reads the whole disk. web_search="disabled" alone leaves the
  # hosted apps connector able to fetch pages, so apps and browser go too.
  set -- exec --ephemeral --skip-git-repo-check -C "$P_DIR" -o "$answer" \
    -c 'default_permissions="council-worker"' -c 'web_search="disabled"' \
    -c "permissions.council-worker.filesystem={$fs}" \
    -c 'permissions.council-worker.network.enabled=false' \
    --disable apps --disable browser_use --disable in_app_browser
  [ -n "${P_MODEL:-}" ] && set -- "$@" -m "$P_MODEL"
  rc=0
  "$P_BIN" "$@" - >/dev/null || rc=$?
  cat "$answer"; rm -f "$answer"
  return $rc
}
PROVIDER_INSTALL_CMD="npm install -g @openai/codex"
PROVIDER_INSTALL_HINT="npm install -g @openai/codex"
PROVIDER_AUTH_KIND=oauth
