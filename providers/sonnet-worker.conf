PROVIDER_ID=sonnet-worker
PROVIDER_LABEL="Claude Sonnet worker"
PROVIDER_ROLE=worker
PROVIDER_SUMMARY="Edits code for council delegate, inside a worktree council created. File
tools only, confined to the worktree; no shell at all, so it edits blind and
council runs the acceptance command. Benchmarked 4/4 contained. Spends Claude
quota, so it ranks below the Codex worker. Never advises or judges."
PROVIDER_CAPS="delegate"
PROVIDER_BASE=sonnet
PROVIDER_CONTAINMENT="claude -p --restricted --permission-mode dontAsk, tools Read,Edit,Write,Glob,Grep, edits allowed only under the worktree, no Bash; refuses to run outside a council delegate worktree"
PROVIDER_RANK=20
PROVIDER_BIN_NAME=claude
PROVIDER_BIN_ENV=CLAUDE_BIN
PROVIDER_BIN_CANDIDATES="$HOME/.local/bin/claude $HOME/.local/bin/claude.exe /usr/local/bin/claude"
PROVIDER_DEFAULT_MODEL=claude-sonnet-5-5
PROVIDER_AUTH_HINT="run 'claude' then /login (Claude subscription)"
PROVIDER_MODELS_HINT="opus, sonnet, haiku, fable; see /model inside claude"

provider_invoke() {
  if [ -z "${P_DIR:-}" ] || [ "$P_DIR" != "${COUNCIL_DELEGATE_WORKTREE:-}" ]; then
    echo "sonnet-worker: refusing to run outside a council delegate worktree" >&2; return 2
  fi
  cd "$P_DIR" || return 2
  # No Bash: an unsandboxed shell that may run the task's own scripts would let
  # a worker edit a script in scope and then execute it. --restricted confines
  # reads to the cwd; Edit(./**) is the only approval (it covers Write too);
  # dontAsk denies everything else instead of prompting. Claude Code refuses
  # edits under ~/.claude, which is why worktrees live in the state dir.
  set -- -p --restricted --strict-mcp-config --settings '{"advisorModel":""}' \
         --tools "Read,Edit,Write,Glob,Grep" --permission-mode dontAsk \
         --allowedTools "Edit(./**)"
  [ -n "${P_MODEL:-}" ] && set -- "$@" --model "$P_MODEL"
  "$P_BIN" "$@"
}
PROVIDER_INSTALL_CMD="npm install -g @anthropic-ai/claude-code"
PROVIDER_INSTALL_HINT="npm install -g @anthropic-ai/claude-code  (or https://claude.com/claude-code)"
PROVIDER_AUTH_KIND=oauth
