# OPTIONAL example: a provider that authenticates with an API KEY instead of
# OAuth. council never requires one — this file exists to show the shape.
#
# To enable:  mv _openai-api.conf openai-api.conf  &&  export OPENAI_API_KEY=...
# Requires curl and jq on PATH. You are billed per token by the vendor.

PROVIDER_ID=openai-api
PROVIDER_LABEL="OpenAI (API key)"
PROVIDER_ROLE=advisor
PROVIDER_SUMMARY="Direct HTTP access to an OpenAI chat model. Metered per token
against your API key rather than a subscription. Useful when you want a model
that has no CLI, or a pinned model version. Has no filesystem access at all, so
it can only reason over what you put in the prompt."
PROVIDER_CAPS="feed reason review tiebreak arbiter"
PROVIDER_RANK=60
PROVIDER_BIN_NAME=curl
PROVIDER_BIN_ENV=CURL_BIN
PROVIDER_BIN_CANDIDATES="/usr/bin/curl /usr/local/bin/curl"
PROVIDER_DEFAULT_MODEL="gpt-4o-mini"
PROVIDER_API_KEY_ENV=OPENAI_API_KEY
PROVIDER_AUTH_KIND=apikey
PROVIDER_AUTH_HINT="export OPENAI_API_KEY=... (optional; OAuth providers need no key)"
PROVIDER_MODELS_HINT="any chat-completions model id"

provider_invoke() {
  if [ -z "${OPENAI_API_KEY:-}" ]; then
    echo "openai-api: OPENAI_API_KEY is not set" >&2
    return 4
  fi
  command -v jq >/dev/null 2>&1 || { echo "openai-api: jq is required" >&2; return 4; }
  prompt="$(cat)"
  body="$(jq -n --arg m "${P_MODEL:-gpt-4o-mini}" --arg p "$prompt" \
    '{model:$m, messages:[{role:"user", content:$p}]}')"
  "$P_BIN" -sS -X POST https://api.openai.com/v1/chat/completions \
    -H "Authorization: Bearer $OPENAI_API_KEY" \
    -H "Content-Type: application/json" \
    -d "$body" \
  | jq -r 'if .error then ("ERROR: " + .error.message | halt_error(1))
           else .choices[0].message.content end'
}
