# Copy this to <yourmodel>.conf to add an LLM. No engine changes needed.
# Drop it in ./providers/ or ~/.config/council/providers/ (the latter wins).

PROVIDER_ID=yourmodel                 # must match the filename
PROVIDER_LABEL="Your Model"
PROVIDER_ROLE=advisor                 # chair | investigator | reader | advisor
PROVIDER_SUMMARY="One paragraph: what this model is genuinely best at, and any
quirk a caller must know. Shown by 'council roles'. Be honest about weaknesses —
the routing rules depend on these claims being true."

# Capabilities drive ALL routing. See policy/rules.conf for the vocabulary.
#   chair         may synthesise and arbitrate (implies it sees other answers)
#   explore       will read a repo itself when given a directory
#   feed          must be handed content; cannot explore
#   reason        general advisory opinions
#   review        code review
#   large-context comfortably ingests very large prompts
#   tiebreak      eligible to break a stalemate
#   arbiter       may judge whether two answers actually disagree
#   write         permitted to modify your disk (grant sparingly)
PROVIDER_CAPS="reason review tiebreak"

PROVIDER_RANK=40                      # lower wins when choosing among equals
PROVIDER_BIN_NAME=yourmodel
PROVIDER_BIN_ENV=YOURMODEL_BIN
PROVIDER_BIN_CANDIDATES="$HOME/.local/bin/yourmodel /usr/local/bin/yourmodel"
PROVIDER_DEFAULT_MODEL=""
PROVIDER_AUTH_HINT="how to log in — OAuth only, never an API key"
PROVIDER_MODELS_HINT="how to list this CLI's models"

# Prompt arrives on stdin. Write ONLY the answer to stdout. Exit non-zero on
# failure. Available: $P_BIN (resolved path), $P_MODEL, $P_DIR.
provider_invoke() {
  set -- --print
  [ -n "${P_MODEL:-}" ] && set -- "$@" --model "$P_MODEL"
  "$P_BIN" "$@"
}
