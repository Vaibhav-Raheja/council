PROVIDER_ID=worker
PROVIDER_LABEL="Worker (stub)"
PROVIDER_ROLE=worker
PROVIDER_SUMMARY="Test stub. Edits the delegate worktree as COUNCIL_TEST_WORKER_MODE says."
PROVIDER_CAPS="delegate"
PROVIDER_BASE=alpha
PROVIDER_CONTAINMENT="test stub; writes only inside the delegate worktree"
PROVIDER_RANK=10
PROVIDER_BIN_NAME="cat"
PROVIDER_BIN_ENV=WORKER_BIN
PROVIDER_BIN_CANDIDATES="/bin/cat /usr/bin/cat"
provider_invoke() {
  p="$(cat)"
  if [ -z "${P_DIR:-}" ] || [ "$P_DIR" != "${COUNCIL_DELEGATE_WORKTREE:-}" ]; then
    echo "worker: refusing to run outside a council delegate worktree" >&2; return 2
  fi
  cd "$P_DIR" || return 2
  [ -n "${COUNCIL_TEST_WORKER_CAPTURE:-}" ] && printf '%s\n' "$p" > "$COUNCIL_TEST_WORKER_CAPTURE"
  case "${COUNCIL_TEST_WORKER_MODE:-ok}" in
    ok)        echo fixed > src/fix.txt; echo "SELF-REPORT: fixed src/fix.txt" ;;
    outside)   echo fixed > src/fix.txt; mkdir -p docs; echo x > docs/x.txt; echo "SELF-REPORT: done" ;;
    forbidden) echo fixed > src/fix.txt; mkdir -p src/secret; echo x > src/secret/k; echo "SELF-REPORT: done" ;;
    protected) echo fixed > src/fix.txt; echo 'src/' > .gitignore; echo "SELF-REPORT: done" ;;
    none)      echo "SELF-REPORT: all done, tests pass" ;;
    tamper)    echo fixed > src/fix.txt; echo "gitdir: /tmp/elsewhere" > .git; echo "SELF-REPORT: done" ;;
    failing)   echo broken > src/fix.txt; echo "SELF-REPORT: fixed, tests pass" ;;
    crash)     echo fixed > src/fix.txt; echo "SELF-REPORT: partial"; return 1 ;;
    big)       echo fixed > src/fix.txt; seq 1 3000 > src/big.txt; echo "SELF-REPORT: done" ;;
  esac
}
