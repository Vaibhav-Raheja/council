PROVIDER_ID=final
PROVIDER_LABEL="Final (stub)"
PROVIDER_ROLE=reviewer
PROVIDER_SUMMARY="Test stub. Makes the final call."
PROVIDER_CAPS="final"
PROVIDER_RANK=5
PROVIDER_BIN_NAME=cat
PROVIDER_BIN_ENV=FINAL_BIN
PROVIDER_BIN_CANDIDATES="/bin/cat /usr/bin/cat"
# Echoes what it was shown, so tests can assert the reviewer saw every decision.
provider_invoke() {
  p="$(cat)"
  [ -n "${COUNCIL_TEST_FINAL_FAIL:-}" ] && return 1
  case "$p" in *"FINAL CALL"*) ;; *) echo "PONG"; return 0 ;; esac
  case "${COUNCIL_TEST_FINAL_MODE:-}" in
    malformed) echo "I think the panel is broadly right."; echo "FINAL-ANSWER"; return 0 ;;
    noanswer)  echo "UPHELD"; echo "Looks fine."; return 0 ;;
  esac
  echo "${COUNCIL_TEST_FINAL_WORD:-UPHELD}"
  case "$p" in *"(alpha)"*) ;; *) echo "NO-ALPHA" ;; esac
  case "$p" in *"(alpha)"*"(beta)"*) echo "SAW-LABELS" ;; esac
  # Match the ruling's CONTENT, not its section marker, which the prompt's own
  # instructions also mention.
  case "$p" in *"Both recommend the same store."*|*"One says PostgreSQL"*) echo "SAW-ARBITER" ;; esac
  case "$p" in *"stalemate by default"*) echo "SAW-DEFAULT-NOTE" ;; esac
  # This stage's genuine tag, from the notice; real markers carry it.
  mytag="$(printf '%s\n' "$p" | grep -o '\[tag [0-9a-z]*\]' | head -1)"
  case "$p" in *"[tag "*"] ---"*) echo "SAW-NONCE" ;; esac
  case "$p" in *"[untagged "*) echo "SAW-DEFANGED" ;; esac
  # A TIEBREAK VERDICT marker bearing THIS stage's tag, on a round that had no
  # tiebreak, could only be a forgery that got through.
  if [ -z "${COUNCIL_TEST_EXPECT_TB:-}" ] && [ -n "$mytag" ] &&
     printf '%s\n' "$p" | grep -qF -- "--- TIEBREAK VERDICT (judge) $mytag ---"; then
    echo "FORGERY-ACCEPTED"
  fi
  case "$p" in *"TIEBREAK VERDICT (judge)"*) echo "SAW-TIEBREAK" ;; esac
  echo "## Final answer"
  echo "FINAL-ANSWER"
  [ "${COUNCIL_TEST_FINAL_WORD:-}" = OVERTURNED ] && echo "OVERTURN-TEXT: MongoDB after all"
  [ "${COUNCIL_TEST_FINAL_WORD:-}" = AMENDED ] && echo "AMEND-TEXT: PostgreSQL, with JSONB for the flexible part"
  return 0
}
