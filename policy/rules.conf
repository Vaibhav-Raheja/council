# Hard rules: who is allowed to do what. The engine enforces these; they are not
# hints. Edit with care — the invariants exist to stop specific failure modes.

# ---- task -> required capability -------------------------------------------
# A provider may only be selected for a task if it declares the required cap.
task:explore      requires=explore
task:digest       requires=large-context
task:review       requires=review
task:advise       requires=reason
task:synthesize   requires=chair
task:tiebreak     requires=tiebreak
task:arbitrate    requires=arbiter

# ---- invariants ------------------------------------------------------------
# no-self-judgement: a provider may never synthesise, arbitrate or break a tie
#   on a round in which it was itself an advisor. Without this the chair grades
#   its own homework and consensus becomes meaningless.
invariant:no-self-judgement = on

# min-advisors: a "council" of one is just a model call. Below this, commands
#   that promise multiple perspectives fail loudly rather than pretend.
invariant:min-advisors = 2

# max-advisors: ceiling on fan-out, so an auto-scaled round cannot spawn
#   unbounded subprocesses and burn quota.
invariant:max-advisors = 6

# write-requires-cap: only providers declaring `write` may touch your disk.
#   Every advisor runs read-only regardless of what its prompt asks for.
invariant:write-requires-cap = on

# reserve-judge: hold the highest-ranked arbiter-capable provider OUT of every
#   advisory panel, so there is always someone eligible to arbitrate, break a
#   tie, or synthesise. Without this, a three-model setup puts everyone in the
#   room and then has nobody left who is allowed to judge.
invariant:reserve-judge = on
